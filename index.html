<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AngryTutor</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AngryTutor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <style>
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #fff5ee 0%, #ffe8d6 100%);
        transition: opacity 0.4s ease;
      }
      #pre-splash.fade-out { opacity: 0; pointer-events: none; }
      #pre-splash .ps-icon {
        width: 90px; height: 90px;
        border-radius: 22px;
        background: linear-gradient(135deg, #e85d3a 0%, #c0392b 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(200, 60, 30, 0.3);
        animation: ps-bounce 1.2s ease infinite;
      }
      #pre-splash .ps-icon svg { width: 50px; height: 50px; }
      #pre-splash .ps-title {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 24px; font-weight: 700; color: #2c2c2c;
        letter-spacing: -0.5px;
      }
      #pre-splash .ps-dots { margin-top: 32px; display: flex; gap: 8px; }
      #pre-splash .ps-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #e85d3a; opacity: 0.3;
        animation: ps-pulse 1.2s ease infinite;
      }
      #pre-splash .ps-dot:nth-child(2) { animation-delay: 0.2s; }
      #pre-splash .ps-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes ps-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ps-pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }
    </style>
  </head>

  <body>
    <div id="pre-splash">
      <div class="ps-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.34 2 9 3.34 9 5H7C5.9 5 5 5.9 5 7V9C3.34 9 2 10.34 2 12C2 13.66 3.34 15 5 15V17C5 18.1 5.9 19 7 19H9C9 20.66 10.34 22 12 22C13.66 22 15 20.66 15 19H17C18.1 19 19 18.1 19 17V15C20.66 15 22 13.66 22 12C22 10.34 20.66 9 19 9V7C19 5.9 18.1 5 17 5H15C15 3.34 13.66 2 12 2Z" fill="white" opacity="0.9"/>
          <circle cx="9.5" cy="10.5" r="1.5" fill="#2c2c2c"/>
          <circle cx="14.5" cy="10.5" r="1.5" fill="#2c2c2c"/>
          <path d="M8.5 14.5C8.5 14.5 9.5 16 12 16C14.5 16 15.5 14.5 15.5 14.5" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ps-title">AngryTutor</div>
      <div class="ps-dots">
        <div class="ps-dot"></div>
        <div class="ps-dot"></div>
        <div class="ps-dot"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
