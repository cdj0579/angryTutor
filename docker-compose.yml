version: '3.8'

services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: angrytutor-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_THREAD=4
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - angrytutor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Service
  backend:
    image: node:18-alpine
    container_name: angrytutor-backend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - NODE_ENV=development
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm start"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - angrytutor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: angrytutor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - angrytutor-network

volumes:
  ollama_data:

networks:
  angrytutor-network:
    driver: bridge

# 启动方式:
# docker-compose up -d
#
# 查看日志:
# docker-compose logs -f
#
# 停止:
# docker-compose down
#
# 初始化模型 (在ollama启动后):
# docker-compose exec ollama ollama pull mistral
